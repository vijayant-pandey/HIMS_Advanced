# Pull-request quality gates (spec 33.1). Runs on every PR into an environment branch and on
# pushes to them. Promotion path (ADR-017): develop -> qa -> staging -> main (production).
# TODO(HIMS-PLAT-013): pin every third-party action to a reviewed commit SHA (spec 33.6).
name: pull-request-ci

on:
  pull_request:
    branches: [develop, qa, staging, main, "hotfix/**"]
  push:
    branches: [develop, qa, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: hims
          POSTGRES_PASSWORD: hims-ci-only
          POSTGRES_DB: hims
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hims" --health-interval 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://hims:hims-ci-only@localhost:5432/hims
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL)
        run: pytest -q
      - name: OpenAPI contract is up to date
        run: |
          python manage.py spectacular --file ../docs/api/openapi.yaml --validate --fail-on-warn
          git diff --exit-code -- ../docs/api/openapi.yaml
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements/base.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the contract
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high --omit=dev

  container:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hims-backend:${{ github.sha }} backend
      - name: Image starts with production settings
        run: |
          docker run --rm \
            -e HIMS_ENVIRONMENT=staging -e HIMS_DATABASE_ENVIRONMENT=staging \
            -e HIMS_DEPLOYMENT_ID=ci-smoke \
            -e DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
            -e DJANGO_ALLOWED_HOSTS=ci.invalid \
            -e DATABASE_URL=postgres://u:p@db.ci.invalid:5432/hims \
            hims-backend:${{ github.sha }} python manage.py check --deploy --fail-level WARNING

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
