# Pull-request quality gates (spec 33.1). Runs on every PR into an environment branch and on
# pushes to them. Promotion path (ADR-017): development -> qa -> staging -> production.
# Supply-chain rules (spec 33.6, HIMS-PLAT-013): every third-party action is pinned to a reviewed
# commit SHA (the comment names its release; Dependabot proposes updates weekly), the token is
# read-only, checkouts do not keep git credentials, and no cloud secrets exist in this workflow.
# common/tests/test_ci_workflows.py fails if any of this is broken.
name: pull-request-ci

on:
  pull_request:
    branches: [development, qa, staging, production, "hotfix/**"]
  push:
    branches: [development, qa, staging, production]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions: {} # nothing by default; each job asks for what it needs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: hims
          POSTGRES_PASSWORD: hims-ci-only
          POSTGRES_DB: hims
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hims" --health-interval 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://hims:hims-ci-only@localhost:5432/hims
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install (hash-locked, HIMS-PLAT-012)
        run: pip install --require-hashes -r requirements/dev.txt
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL)
        run: pytest -q
      - name: OpenAPI contract is up to date
        run: |
          python manage.py spectacular --file ../docs/api/openapi.yaml --validate --fail-on-warn
          git diff --exit-code -- ../docs/api/openapi.yaml
      - name: Dependency vulnerabilities
        run: |
          pip-audit -r requirements/base.txt
          pip-audit -r requirements/dev.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the contract
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Bundle size budget (HIMS-PLAT-015)
        run: npm run size
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high --omit=dev

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t hims-backend:${{ github.sha }} backend
      - name: Image starts with production settings
        run: |
          docker run --rm \
            -e HIMS_ENVIRONMENT=staging -e HIMS_DATABASE_ENVIRONMENT=staging \
            -e HIMS_DEPLOYMENT_ID=ci-smoke \
            -e DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
            -e DJANGO_ALLOWED_HOSTS=ci.invalid \
            -e HIMS_FIELD_ENCRYPTION_KEYS="$(openssl rand -base64 32 | tr '+/' '-_')" \
            -e HIMS_AUDIT_CHAIN_KEYS="ci:$(openssl rand -hex 32)" \
            -e DATABASE_URL=postgres://u:p@db.ci.invalid:5432/hims \
            -e HIMS_ACCEPT_LOCAL_DOCUMENT_STORAGE=true \
            hims-backend:${{ github.sha }} python manage.py check --deploy --fail-level WARNING

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
