# Browser tests with Playwright (spec 19.2, 33.1 "fast PR suite and a broader scheduled suite";
# HIMS-QA-001). Runs on PRs into development, every night and on demand. Not a required check:
# it does not block merging until the product owner adds it to the branch ruleset.
# Actions are pinned to commit SHAs (HIMS-PLAT-013; enforced by common/tests/test_ci_workflows.py).
name: browser-tests

on:
  pull_request:
    branches: [development]
  schedule:
    - cron: "30 21 * * *" # 03:00 India time
  workflow_dispatch:

permissions: {}

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: hims
          POSTGRES_PASSWORD: hims-ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hims" --health-interval 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://hims:hims-ci-only@localhost:5432/hims_e2e
      HIMS_E2E_PYTHON: python
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (hash-locked)
        working-directory: backend
        run: pip install --require-hashes -r requirements/base.txt
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npm run e2e
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
