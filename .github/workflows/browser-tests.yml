# Browser tests with Playwright (spec 19.2, 33.1 "fast PR suite and a broader scheduled suite";
# HIMS-QA-001; the US hospital and the admin console: HIMS-QA-003). Runs on PRs into development,
# every night and on demand. Not a required check:
# it does not block merging until the product owner adds it to the branch ruleset.
# Actions are pinned to commit SHAs (HIMS-PLAT-013; enforced by common/tests/test_ci_workflows.py).
name: browser-tests

on:
  pull_request:
    branches: [development]
  schedule:
    - cron: "30 21 * * *" # 03:00 India time
  workflow_dispatch:

permissions: {}

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: hims
          POSTGRES_PASSWORD: hims-ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hims" --health-interval 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://hims:hims-ci-only@localhost:5432/hims_e2e
      HIMS_E2E_PYTHON: python
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (hash-locked)
        working-directory: backend
        run: pip install --require-hashes -r requirements/base.txt
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          # Extra fonts come from Ubuntu's servers; when those cannot be reached, Chrome alone is
          # enough (its libraries are already on the runner).
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Browser tests (India hospital and the admin console)
        working-directory: frontend
        run: npm run e2e
      - name: Browser tests (US hospital, a separate deployment)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run e2e:us
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/playwright-report-us
            frontend/test-results-us
          retention-days: 7
