# Local development dependencies only (spec 31.3). Synthetic data only.
# Never point these services at, or load data from, a managed environment.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: hims
      POSTGRES_PASSWORD: hims-local-only
      POSTGRES_DB: hims
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hims"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Optional trace viewer (HIMS-PLAT-016). Starts only when asked for:
  #   docker compose --profile tracing up -d jaeger
  # then set HIMS_TRACING_EXPORTER=otlp and OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  # in backend/.env and open http://localhost:16686 (see docs/workflows/tracing.md).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    ports:
      - "16686:16686" # web UI
      - "4318:4318" # OTLP over HTTP

volumes:
  postgres-data:
