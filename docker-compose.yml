# Local development dependencies only (spec 31.3). Synthetic data only.
# Never point these services at, or load data from, a managed environment.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: hims
      POSTGRES_PASSWORD: hims-local-only
      POSTGRES_DB: hims
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hims"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
