{% extends "admin/change_form.html" %}
{# "Download as CSV": the same evidence file as the app, after "confirm it's you" (HIMS-IAM-012). #}
{% block object-tools-items %}
  {% if original %}
  <li>
    <form method="post" action="{% url 'admin:access_control_accessreview_export' original.pk %}" style="display:inline">
      {% csrf_token %}
      <button type="submit" class="button" style="padding:6px 12px">Download as CSV</button>
    </form>
  </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
