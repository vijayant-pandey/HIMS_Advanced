        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WardCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ward'
          description: ''
