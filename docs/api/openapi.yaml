      - decided_by_name
      - decision_note
      - end_reason
      - ended_at
      - ended_by_name
      - ends_at
      - hours
      - id
      - kind
      - kind_label
      - reason
      - requested_by
      - role
      - starts_at
      - status
      - status_label
      - version
    SupportAccessCancelRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
      required:
      - version
    SupportAccessDecisionRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        note:
          type: string
          default: ''
          maxLength: 2000
      required:
      - version
    SupportAccessEndRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
      - version
    SupportAccessKindEnum:
      enum:
      - standard
      - emergency
      type: string
      description: |-
        * `standard` - Asked for, approved by the hospital
        * `emergency` - Emergency (opened at once)
    SupportAccessOptions:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/SupportRole'
        default_hours:
          type: integer
        max_hours:
          type: integer
        emergency_notice:
          type: boolean
          description: Whether the hospital's administrators are emailed about emergency
            access.
      required:
      - default_hours
      - emergency_notice
      - max_hours
      - roles
    SupportAccessRequestRequest:
      type: object
      properties:
        role:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        hours:
          type: integer
          maximum: 24
          minimum: 1
        emergency:
          type: boolean
          default: false
          description: Open the access at once without waiting for the hospital (emergencies
            only).
      required:
      - reason
      - role
    SupportAccessStatusEnum:
      enum:
      - waiting
      - active
      - finished
      - refused
      - cancelled
      - ended_early
      type: string
      description: |-
        * `waiting` - Waiting for the hospital
        * `active` - Active now
        * `finished` - Finished (time ran out)
        * `refused` - Refused
        * `cancelled` - Cancelled by the supplier
        * `ended_early` - Ended early
    SupportRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
      required:
      - code
      - description
      - id
      - name
    TemplateVariable:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        required:
          type: boolean
      required:
      - description
      - name
      - required
    TestMessageRequest:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        to:
          type: string
          minLength: 1
          description: An email address, or a phone number like +919876543210.
          maxLength: 254
      required:
      - channel
      - to
    Traces:
      type: object
      properties:
        exporter:
          type: string
          description: none, console or otlp
        sent_elsewhere:
          type: boolean
        error_text_filtered:
          type: boolean
      required:
      - error_text_filtered
      - exporter
      - sent_elsewhere
    TreatmentEnum:
      enum:
      - mitigate
      - accept
      - transfer
      - avoid
      type: string
      description: |-
        * `mitigate` - Reduce it
        * `accept` - Accept it
        * `transfer` - Transfer it (e.g. insurance, vendor)
        * `avoid` - Avoid it
    TreeBed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        bed_type:
          type: string
        status:
          type: string
        status_reason:
          type: string
        is_active:
          type: boolean
        version:
          type: integer
      required:
      - bed_type
      - code
      - id
      - is_active
      - status
      - status_reason
      - version
    TreeBuilding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        is_active:
          type: boolean
        version:
          type: integer
        floors:
          type: array
          items:
            $ref: '#/components/schemas/TreeFloor'
      required:
      - code
      - floors
      - id
      - is_active
      - name
      - version
    TreeFloor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        level:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
        version:
          type: integer
        wards:
          type: array
          items:
            $ref: '#/components/schemas/TreeWard'
      required:
      - id
      - is_active
      - level
      - name
      - version
      - wards
    TreeRoom:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        room_type:
          type: string
        is_isolation_capable:
          type: boolean
        is_active:
          type: boolean
        version:
          type: integer
        beds:
          type: array
          items:
            $ref: '#/components/schemas/TreeBed'
      required:
      - beds
      - code
      - id
      - is_active
      - is_isolation_capable
      - name
      - room_type
      - version
    TreeWard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        ward_type:
          type: string
        department:
          type: string
          format: uuid
          nullable: true
        department_name:
          type: string
          nullable: true
        gender_restriction:
          type: string
        age_group:
          type: string
        is_active:
          type: boolean
        version:
          type: integer
        bed_counts:
          type: object
          additionalProperties:
            type: integer
          description: by status
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/TreeRoom'
      required:
      - age_group
      - bed_counts
      - code
      - department
      - department_name
      - gender_restriction
      - id
      - is_active
      - name
      - rooms
      - version
      - ward_type
    TriggerEnum:
      enum:
      - scheduled
      - on_demand
      - command
      type: string
      description: |-
        * `scheduled` - Daily automatic check
        * `on_demand` - Started by a person
        * `command` - Started from the server command line
    VerificationStatusEnum:
      enum:
      - unverified
      - verified
      - rejected
      type: string
      description: |-
        * `unverified` - Unverified
        * `verified` - Verified
        * `rejected` - Rejected
    Ward:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        facility:
          type: string
          format: uuid
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        floor:
          type: string
          format: uuid
          readOnly: true
        department:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        ward_type:
          allOf:
          - $ref: '#/components/schemas/WardTypeEnum'
          readOnly: true
        gender_restriction:
          allOf:
          - $ref: '#/components/schemas/GenderRestrictionEnum'
          readOnly: true
        age_group:
          allOf:
          - $ref: '#/components/schemas/AgeGroupEnum'
          readOnly: true
      required:
      - age_group
      - code
      - created_at
      - department
      - facility
      - floor
      - gender_restriction
      - id
      - is_active
      - name
      - updated_at
      - version
      - ward_type
    WardCreateRequest:
      type: object
      properties:
        floor:
          type: string
          format: uuid
        department:
          type: string
          format: uuid
          nullable: true
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 255
        ward_type:
          $ref: '#/components/schemas/WardTypeEnum'
        gender_restriction:
          $ref: '#/components/schemas/GenderRestrictionEnum'
        age_group:
          $ref: '#/components/schemas/AgeGroupEnum'
      required:
      - code
      - floor
      - name
      - ward_type
    WardTypeEnum:
      enum:
      - general
      - private
      - icu
      - hdu
      - nicu
      - picu
      - emergency
      - maternity
      - isolation
      - day_care
      - operating_theatre
      - recovery
      type: string
      description: |-
        * `general` - General ward
        * `private` - Private ward
        * `icu` - Intensive care unit (ICU)
        * `hdu` - High dependency unit (HDU)
        * `nicu` - Neonatal ICU (NICU)
        * `picu` - Pediatric ICU (PICU)
        * `emergency` - Emergency / casualty
        * `maternity` - Maternity / labour
        * `isolation` - Isolation ward
        * `day_care` - Day care
        * `operating_theatre` - Operating theatre complex
        * `recovery` - Recovery / PACU
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    YearFormatEnum:
      enum:
      - full
      - short
      type: string
      description: |-
        * `full` - Full (2026, 2026-27)
        * `short` - Short (26, 26-27)
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: hims_session
