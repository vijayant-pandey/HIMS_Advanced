components:
  schemas:
    AccessDelegation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        delegator:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        delegate:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DelegationStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ended_by_name:
          type: string
          readOnly: true
          nullable: true
        end_reason:
          type: string
          readOnly: true
        lent_access:
          type: array
          items:
            $ref: '#/components/schemas/LentAccess'
          readOnly: true
        version:
          type: integer
          readOnly: true
      required:
      - created_at
      - created_by_name
      - delegate
      - delegator
      - end_reason
      - ended_at
      - ended_by_name
      - ends_at
      - id
      - lent_access
      - reason
      - starts_at
      - status
      - status_label
      - version
    AccessDelegationCreateRequest:
      type: object
      properties:
        delegator:
          type: string
          format: uuid
          description: The person being covered.
        delegate:
          type: string
          format: uuid
          description: The person covering.
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: Empty = now.
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        assignments:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: Which of the covered person's access to lend. Empty = all that
            can be lent.
      required:
      - delegate
      - delegator
      - ends_at
      - reason
    AccessDelegationCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        delegator:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        delegate:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DelegationStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ended_by_name:
          type: string
          readOnly: true
          nullable: true
        end_reason:
          type: string
          readOnly: true
        lent_access:
          type: array
          items:
            $ref: '#/components/schemas/LentAccess'
          readOnly: true
        version:
          type: integer
          readOnly: true
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedAccess'
          readOnly: true
      required:
      - created_at
      - created_by_name
      - delegate
      - delegator
      - end_reason
      - ended_at
      - ended_by_name
      - ends_at
      - id
      - lent_access
      - reason
      - skipped
      - starts_at
      - status
      - status_label
      - version
    AccessDelegationEndRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
      - version
    AccessReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AccessReviewStatusEnum'
          readOnly: true
        due_on:
          type: string
          format: date
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_by_name:
          type: string
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_by_name:
          type: string
          readOnly: true
          nullable: true
        notes:
          type: string
          readOnly: true
          description: Summary or reason for cancelling.
        summary:
          allOf:
          - $ref: '#/components/schemas/AccessReviewSummary'
          readOnly: true
        version:
          type: integer
          readOnly: true
      required:
      - completed_at
      - completed_by_name
      - created_at
      - due_on
      - id
      - notes
      - started_by_name
      - status
      - summary
      - title
      - version
    AccessReviewCancelRequest:
      type: object
      properties:
        version:
          type: integer
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
      - version
    AccessReviewCompleteRequest:
      type: object
      properties:
        version:
          type: integer
        notes:
          type: string
          default: ''
          maxLength: 4000
      required:
      - version
    AccessReviewDecideDecisionEnum:
      enum:
      - keep
      - remove
      type: string
      description: |-
        * `keep` - keep
        * `remove` - remove
    AccessReviewDecideRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
          minItems: 1
        decision:
          $ref: '#/components/schemas/AccessReviewDecideDecisionEnum'
        comment:
          type: string
          default: ''
          maxLength: 2000
      required:
      - decision
      - items
    AccessReviewItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        person_name:
          type: string
          readOnly: true
        person_email:
          type: string
          format: email
          readOnly: true
        account_active:
          type: boolean
          readOnly: true
          description: Could the person sign in when it started?
        last_signed_in_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        role_name:
          type: string
          readOnly: true
        scope:
          type: string
          readOnly: true
          description: Where, e.g. "Whole hospital".
        granted_at:
          type: string
          format: date-time
          readOnly: true
        access_ends_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decision:
          allOf:
          - $ref: '#/components/schemas/AccessReviewItemDecisionEnum'
          readOnly: true
        decided_by_name:
          type: string
          readOnly: true
          nullable: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        comment:
          type: string
          readOnly: true
        is_own:
          type: boolean
          readOnly: true
          description: 'Your own access: someone else must decide it.'
      required:
      - access_ends_at
      - account_active
      - comment
      - decided_at
      - decided_by_name
      - decision
      - granted_at
      - id
      - is_own
      - last_signed_in_at
      - person_email
      - person_name
      - role_name
      - scope
    AccessReviewItemDecisionEnum:
      enum:
      - pending
      - keep
      - remove
      - ended
      type: string
      description: |-
        * `pending` - Not reviewed yet
        * `keep` - Keep
        * `remove` - Removed
        * `ended` - Already ended elsewhere
    AccessReviewSchedule:
      type: object
      properties:
        interval_days:
          type: integer
        last_completed_at:
          type: string
          format: date-time
          nullable: true
        next_due_on:
          type: string
          format: date
        review_due:
          type: boolean
          description: No review in progress and one is due.
        open_review_id:
          type: string
          format: uuid
          nullable: true
        open_review_overdue:
          type: boolean
      required:
      - interval_days
      - last_completed_at
      - next_due_on
      - open_review_id
      - open_review_overdue
      - review_due
    AccessReviewStartRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        due_on:
          type: string
          format: date
          nullable: true
          description: Finish by (default 14 days).
      required:
      - title
    AccessReviewStatusEnum:
      enum:
      - open
      - completed
      - cancelled
      type: string
      description: |-
        * `open` - In progress
        * `completed` - Completed
        * `cancelled` - Cancelled
    AccessReviewSummary:
      type: object
      properties:
        pending:
          type: integer
        keep:
          type: integer
        remove:
          type: integer
        ended:
          type: integer
      required:
      - ended
      - keep
      - pending
      - remove
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        activated:
          type: boolean
          readOnly: true
          description: Has chosen a password.
