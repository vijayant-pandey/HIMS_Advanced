openapi: 3.0.3
info:
  title: HIMS API
  version: 1.0.0
  description: Hospital Information Management System REST API (v1).
paths:
  /api/v1/audit-events/:
    get:
      operationId: audit_events_list
      description: Audit search for auditors. Searching the audit log is itself audited.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor_id
        schema:
          type: string
      - in: query
        name: facility_id
        schema:
          type: string
      - in: query
        name: occurred_after
        schema:
          type: string
      - in: query
        name: occurred_before
        schema:
          type: string
      - in: query
        name: outcome
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      tags:
      - audit-events
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie the SPA must echo in X-CSRFToken on unsafe
        requests.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/invitations/accept/:
    post:
      operationId: auth_invitations_accept_create
      description: |-
        Invitation endpoints are used before the person has a password, so they are public,
        CSRF-protected and rate limited. The token comes in the body, never in the URL.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/invitations/inspect/:
    post:
      operationId: auth_invitations_inspect_create
      description: |-
        Invitation endpoints are used before the person has a password, so they are public,
        CSRF-protected and rate limited. The token comes in the body, never in the URL.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationDetails'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
