        * `scheduled` - Daily automatic check
        * `on_demand` - Started by a person
        * `command` - Started from the server command line
    VerificationStatusEnum:
      enum:
      - unverified
      - verified
      - rejected
      type: string
      description: |-
        * `unverified` - Unverified
        * `verified` - Verified
        * `rejected` - Rejected
    Ward:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        facility:
          type: string
          format: uuid
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        floor:
          type: string
          format: uuid
          readOnly: true
        department:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        ward_type:
          allOf:
          - $ref: '#/components/schemas/WardTypeEnum'
          readOnly: true
        gender_restriction:
          allOf:
          - $ref: '#/components/schemas/GenderRestrictionEnum'
          readOnly: true
        age_group:
          allOf:
          - $ref: '#/components/schemas/AgeGroupEnum'
          readOnly: true
      required:
      - age_group
      - code
      - created_at
      - department
      - facility
      - floor
      - gender_restriction
      - id
      - is_active
      - name
      - updated_at
      - version
      - ward_type
    WardCreateRequest:
      type: object
      properties:
        floor:
          type: string
          format: uuid
        department:
          type: string
          format: uuid
          nullable: true
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 255
        ward_type:
          $ref: '#/components/schemas/WardTypeEnum'
        gender_restriction:
          $ref: '#/components/schemas/GenderRestrictionEnum'
        age_group:
          $ref: '#/components/schemas/AgeGroupEnum'
      required:
      - code
      - floor
      - name
      - ward_type
    WardTypeEnum:
      enum:
      - general
      - private
      - icu
      - hdu
      - nicu
      - picu
      - emergency
      - maternity
      - isolation
      - day_care
      - operating_theatre
      - recovery
      type: string
      description: |-
        * `general` - General ward
        * `private` - Private ward
        * `icu` - Intensive care unit (ICU)
        * `hdu` - High dependency unit (HDU)
        * `nicu` - Neonatal ICU (NICU)
        * `picu` - Pediatric ICU (PICU)
        * `emergency` - Emergency / casualty
        * `maternity` - Maternity / labour
        * `isolation` - Isolation ward
        * `day_care` - Day care
        * `operating_theatre` - Operating theatre complex
        * `recovery` - Recovery / PACU
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    YearFormatEnum:
      enum:
      - full
      - short
      type: string
      description: |-
        * `full` - Full (2026, 2026-27)
        * `short` - Short (26, 26-27)
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: hims_session
