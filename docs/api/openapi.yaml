  /api/v1/wards/:
    get:
      operationId: wards_list
      description: |-
        Facility-scoped list/retrieve/create/update shared by every location level.

        Subclasses set ``model``, the three serializers, ``parent_field`` and the query filters.
        Creating checks ``locations.manage`` at the *parent's* facility; editing checks it at the
        object's facility. Nothing is ever deleted (deactivate with ``is_active: false``).
      parameters:
      - in: query
        name: active
        schema:
          type: string
        description: '''true'' = active only'
      - in: query
        name: department
        schema:
          type: string
      - in: query
        name: facility
        schema:
          type: string
      - in: query
        name: floor
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: ward_type
        schema:
          type: string
      tags:
      - wards
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWardList'
          description: ''
    post:
      operationId: wards_create
      description: |-
        Facility-scoped list/retrieve/create/update shared by every location level.

        Subclasses set ``model``, the three serializers, ``parent_field`` and the query filters.
        Creating checks ``locations.manage`` at the *parent's* facility; editing checks it at the
        object's facility. Nothing is ever deleted (deactivate with ``is_active: false``).
