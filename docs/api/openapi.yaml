components:
  schemas:
    AccessDelegation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        delegator:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        delegate:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DelegationStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ended_by_name:
          type: string
          readOnly: true
          nullable: true
        end_reason:
          type: string
          readOnly: true
        lent_access:
          type: array
          items:
            $ref: '#/components/schemas/LentAccess'
          readOnly: true
        version:
          type: integer
          readOnly: true
      required:
      - created_at
      - created_by_name
      - delegate
      - delegator
      - end_reason
      - ended_at
      - ended_by_name
      - ends_at
      - id
      - lent_access
      - reason
      - starts_at
      - status
      - status_label
      - version
    AccessDelegationCreateRequest:
      type: object
      properties:
        delegator:
          type: string
          format: uuid
          description: The person being covered.
        delegate:
          type: string
          format: uuid
          description: The person covering.
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: Empty = now.
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        assignments:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: Which of the covered person's access to lend. Empty = all that
            can be lent.
      required:
      - delegate
      - delegator
      - ends_at
      - reason
    AccessDelegationCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        delegator:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        delegate:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DelegationStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ended_by_name:
          type: string
          readOnly: true
          nullable: true
        end_reason:
          type: string
          readOnly: true
        lent_access:
          type: array
          items:
            $ref: '#/components/schemas/LentAccess'
          readOnly: true
        version:
          type: integer
          readOnly: true
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedAccess'
          readOnly: true
      required:
      - created_at
      - created_by_name
      - delegate
      - delegator
      - end_reason
      - ended_at
      - ended_by_name
      - ends_at
      - id
      - lent_access
      - reason
      - skipped
      - starts_at
      - status
      - status_label
      - version
    AccessDelegationEndRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
      - version
    AccessReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AccessReviewStatusEnum'
          readOnly: true
        due_on:
          type: string
          format: date
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_by_name:
          type: string
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_by_name:
          type: string
          readOnly: true
          nullable: true
        notes:
          type: string
          readOnly: true
          description: Summary or reason for cancelling.
        summary:
          allOf:
          - $ref: '#/components/schemas/AccessReviewSummary'
          readOnly: true
        version:
          type: integer
          readOnly: true
      required:
      - completed_at
      - completed_by_name
      - created_at
      - due_on
