components:
  schemas:
    ActiveStatusEnum:
      enum:
      - active
      - inactive
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
    ActorTypeEnum:
      enum:
      - user
      - system
      - anonymous
      type: string
      description: |-
        * `user` - User
        * `system` - System
        * `anonymous` - Anonymous
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        facility_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_type:
          allOf:
          - $ref: '#/components/schemas/ActorTypeEnum'
          readOnly: true
        actor_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        changes:
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor_id
      - actor_type
      - changes
      - facility_id
      - id
      - ip_address
      - metadata
      - occurred_at
      - outcome
      - reason
      - request_id
      - resource_id
      - resource_type
    CountryEnum:
      enum:
      - US
      - IN
      type: string
      description: |-
        * `US` - United States
        * `IN` - India
    CredentialTypeEnum:
      enum:
      - medical_registration
      - nursing_registration
      - pharmacy_registration
      - state_license
      - npi
      - dea_registration
      - other
      type: string
      description: |-
        * `medical_registration` - Medical council registration
        * `nursing_registration` - Nursing council registration
        * `pharmacy_registration` - Pharmacy council registration
        * `state_license` - State licence (US)
        * `npi` - National Provider Identifier (US)
