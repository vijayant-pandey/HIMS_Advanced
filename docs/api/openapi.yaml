openapi: 3.0.3
info:
  title: HIMS API
  version: 1.0.0
  description: Hospital Information Management System REST API (v1).
paths:
  /api/v1/audit-events/:
    get:
      operationId: audit_events_list
      description: Audit search for auditors. Searching the audit log is itself audited.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor_id
        schema:
          type: string
      - in: query
        name: facility_id
        schema:
          type: string
      - in: query
        name: occurred_after
        schema:
          type: string
      - in: query
        name: occurred_before
        schema:
          type: string
      - in: query
        name: outcome
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      tags:
      - audit-events
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie the SPA must echo in X-CSRFToken on unsafe
        requests.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/invitations/accept/:
    post:
      operationId: auth_invitations_accept_create
      description: |-
        Invitation endpoints are used before the person has a password, so they are public,
        CSRF-protected and rate limited. The token comes in the body, never in the URL.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/invitations/inspect/:
    post:
      operationId: auth_invitations_inspect_create
      description: |-
        Invitation endpoints are used before the person has a password, so they are public,
        CSRF-protected and rate limited. The token comes in the body, never in the URL.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationDetails'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 200 = signed in. 202 = password accepted; send the authenticator
        code to /auth/login/verify/ to finish signing in.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallenge'
          description: ''
  /api/v1/auth/login/verify/:
    post:
      operationId: auth_login_verify_create
      description: Second sign-in step for accounts with two-factor on (HIMS-IAM-005).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/mfa/:
    get:
      operationId: auth_mfa_retrieve
      description: Two-factor status for the signed-in user. Always reachable, so
        people can set it up.
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
          description: ''
  /api/v1/auth/mfa/confirm/:
    post:
      operationId: auth_mfa_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodes'
          description: ''
  /api/v1/auth/mfa/disable/:
    post:
      operationId: auth_mfa_disable_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/mfa/recovery-codes/:
    post:
      operationId: auth_mfa_recovery_codes_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodes'
          description: ''
  /api/v1/auth/mfa/setup/:
    post:
      operationId: auth_mfa_setup_create
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
          description: ''
  /api/v1/auth/no-access-report/:
    post:
      operationId: auth_no_access_report_create
      description: |-
        Called by the app when a signed-in user has no role yet (HIMS-UI-002).

        Records an ``access.none_assigned`` audit event and returns its reference number (the
        request ID), which the "no access yet" page shows so an administrator can find the event.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoAccessReportRequest'
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoAccessReference'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Sets the new password. The person then signs in again; all old
        sessions have ended.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/inspect/:
    post:
      operationId: auth_password_reset_inspect_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetTokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetDetails'
          description: ''
  /api/v1/auth/password-reset/request/:
    post:
      operationId: auth_password_reset_request_create
      description: Always answers 202 with the same message, whether or not the account
        exists.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequested'
          description: ''
  /api/v1/beds/:
    get:
      operationId: beds_list
      parameters:
      - in: query
        name: active
        schema:
          type: string
        description: '''true'' = active only'
      - in: query
        name: bed_type
        schema:
          type: string
      - in: query
        name: facility
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: room
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: ward
        schema:
          type: string
      tags:
      - beds
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBedList'
          description: ''
    post:
      operationId: beds_create
      tags:
      - beds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BedCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
          description: ''
  /api/v1/beds/{id}/:
    get:
      operationId: beds_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bed.
        required: true
      tags:
      - beds
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
          description: ''
    patch:
      operationId: beds_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bed.
        required: true
      tags:
      - beds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBedUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
          description: ''
  /api/v1/beds/{id}/status/:
    post:
      operationId: beds_status_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bed.
        required: true
      tags:
      - beds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BedStatusChangeRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
          description: ''
  /api/v1/beds/bulk/:
    post:
      operationId: beds_bulk_create
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - beds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkBedsRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBedList'
          description: ''
  /api/v1/buildings/:
    get:
      operationId: buildings_list
      description: |-
        Facility-scoped list/retrieve/create/update shared by every location level.

        Subclasses set ``model``, the three serializers, ``parent_field`` and the query filters.
        Creating checks ``locations.manage`` at the *parent's* facility; editing checks it at the
        object's facility. Nothing is ever deleted (deactivate with ``is_active: false``).
      parameters:
      - in: query
        name: active
        schema:
          type: string
        description: '''true'' = active only'
      - in: query
        name: facility
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - buildings
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuildingList'
          description: ''
    post:
      operationId: buildings_create
      description: |-
        Facility-scoped list/retrieve/create/update shared by every location level.

        Subclasses set ``model``, the three serializers, ``parent_field`` and the query filters.
        Creating checks ``locations.manage`` at the *parent's* facility; editing checks it at the
        object's facility. Nothing is ever deleted (deactivate with ``is_active: false``).
      tags:
      - buildings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
          description: ''
  /api/v1/buildings/{id}/:
    get:
      operationId: buildings_retrieve
      description: |-
        Facility-scoped list/retrieve/create/update shared by every location level.

        Subclasses set ``model``, the three serializers, ``parent_field`` and the query filters.
        Creating checks ``locations.manage`` at the *parent's* facility; editing checks it at the
        object's facility. Nothing is ever deleted (deactivate with ``is_active: false``).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this building.
        required: true
      tags:
      - buildings
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
          description: ''
    patch:
      operationId: buildings_partial_update
      description: |-
        Facility-scoped list/retrieve/create/update shared by every location level.

        Subclasses set ``model``, the three serializers, ``parent_field`` and the query filters.
        Creating checks ``locations.manage`` at the *parent's* facility; editing checks it at the
        object's facility. Nothing is ever deleted (deactivate with ``is_active: false``).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this building.
        required: true
      tags:
      - buildings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBuildingUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
          description: ''
  /api/v1/departments/:
    get:
      operationId: departments_list
      parameters:
      - in: query
        name: facility
        schema:
          type: string
        description: Filter by facility ID
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - departments
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartmentList'
          description: ''
    post:
      operationId: departments_create
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: departments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - departments
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    patch:
      operationId: departments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/designations/:
    get:
      operationId: designations_list
      description: Job-title catalog (junior to senior). Filter with ?country=IN|US
        and ?category=.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: country
        schema:
          type: string
        description: IN or US (shared titles included)
      tags:
      - designations
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Designation'
          description: ''
  /api/v1/facilities/:
    get:
      operationId: facilities_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - facilities
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFacilityList'
          description: ''
    post:
      operationId: facilities_create
      tags:
      - facilities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
          description: ''
  /api/v1/facilities/{id}/:
    get:
      operationId: facilities_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this facility.
        required: true
      tags:
      - facilities
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
          description: ''
    patch:
      operationId: facilities_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this facility.
        required: true
      tags:
      - facilities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFacilityUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
          description: ''
  /api/v1/facilities/{id}/locations/:
    get:
      operationId: facilities_locations_retrieve
      description: |-
        The whole building → floor → ward → room → bed structure of one facility.

        One request with five queries, used by the Locations screen and the future bed board.
      parameters:
      - in: query
        name: active
        schema:
          type: string
        description: '''true'' = active only'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - facilities
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityLocations'
          description: ''
  /api/v1/features/:
    get:
      operationId: features_list
      description: |-
        Every feature with its default and settings. With ``?facility=``: per-facility features
        only, with that facility's settings.
      parameters:
      - in: query
        name: facility
        schema:
          type: string
        description: Facility id
      tags:
      - features
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureState'
          description: ''
  /api/v1/features/{key}/change/:
    post:
      operationId: features_change
      description: Turn a feature on, off or back to the default, for the hospital
        or one facility.
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureChangeRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureState'
          description: ''
  /api/v1/features/effective/:
    get:
      operationId: features_effective_retrieve
      description: |-
        What is on right now, for the app to show or hide things.

        Before sign-in only public features are returned (e.g. whether to show "Forgot password?").
        Showing or hiding is a convenience; the server enforces every feature itself.
      tags:
      - features
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveFeatures'
          description: ''
  /api/v1/floors/:
    get:
      operationId: floors_list
      description: |-
        Facility-scoped list/retrieve/create/update shared by every location level.

        Subclasses set ``model``, the three serializers, ``parent_field`` and the query filters.
        Creating checks ``locations.manage`` at the *parent's* facility; editing checks it at the
        object's facility. Nothing is ever deleted (deactivate with ``is_active: false``).
      parameters:
      - in: query
        name: active
        schema:
          type: string
        description: '''true'' = active only'
      - in: query
        name: building
        schema:
          type: string
      - in: query
        name: facility
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - floors
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
