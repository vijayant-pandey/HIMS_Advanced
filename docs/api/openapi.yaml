openapi: 3.0.3
info:
  title: HIMS API
  version: 1.0.0
  description: Hospital Information Management System REST API (v1).
paths:
  /api/v1/access-delegations/:
    get:
      operationId: access_delegations_list
      parameters:
      - in: query
        name: person
        schema:
          type: string
        description: Only cover this person gives or gets.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - all
          - current
          - past
        description: current (default) = active or starting later; past = finished
          or ended early.
      tags:
      - access-delegations
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessDelegation'
          description: ''
    post:
      operationId: access_delegations_create
      tags:
      - access-delegations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessDelegationCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDelegationCreated'
          description: ''
  /api/v1/access-delegations/{id}/:
    get:
      operationId: access_delegations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this access delegation.
        required: true
      tags:
      - access-delegations
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDelegation'
          description: ''
  /api/v1/access-delegations/{id}/end/:
    post:
      operationId: access_delegations_end_create
      description: End the cover now; every lent role is removed at once.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this access delegation.
        required: true
      tags:
      - access-delegations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessDelegationEndRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDelegation'
          description: ''
  /api/v1/access-delegations/delegable/:
    get:
      operationId: access_delegations_delegable_list
      description: The person's own current access, and whether each can be lent.
      parameters:
      - in: query
        name: user
        schema:
          type: string
        required: true
      tags:
      - access-delegations
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DelegableAccess'
          description: ''
  /api/v1/access-reviews/:
    get:
      operationId: access_reviews_list
      description: |-
        Periodic access reviews (HIMS-IAM-012). Auditors can read and download them;
        reviewers (``access.reviews.manage``) run them. Nobody decides on their own access.
      tags:
      - access-reviews
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessReview'
          description: ''
    post:
      operationId: access_reviews_create
      description: |-
        Periodic access reviews (HIMS-IAM-012). Auditors can read and download them;
        reviewers (``access.reviews.manage``) run them. Nobody decides on their own access.
      tags:
      - access-reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessReviewStartRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReview'
          description: ''
  /api/v1/access-reviews/{id}/:
    get:
      operationId: access_reviews_retrieve
      description: |-
        Periodic access reviews (HIMS-IAM-012). Auditors can read and download them;
        reviewers (``access.reviews.manage``) run them. Nobody decides on their own access.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this access review.
        required: true
      tags:
      - access-reviews
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReview'
          description: ''
  /api/v1/access-reviews/{id}/cancel/:
    post:
      operationId: access_reviews_cancel_create
      description: |-
        Periodic access reviews (HIMS-IAM-012). Auditors can read and download them;
        reviewers (``access.reviews.manage``) run them. Nobody decides on their own access.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this access review.
        required: true
      tags:
      - access-reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessReviewCancelRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReview'
          description: ''
  /api/v1/access-reviews/{id}/complete/:
    post:
      operationId: access_reviews_complete_create
      description: |-
        Periodic access reviews (HIMS-IAM-012). Auditors can read and download them;
        reviewers (``access.reviews.manage``) run them. Nobody decides on their own access.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this access review.
        required: true
      tags:
      - access-reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessReviewCompleteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReview'
          description: ''
  /api/v1/access-reviews/{id}/decide/:
    post:
      operationId: access_reviews_decide_create
      description: Keep or remove access for one or more people. Removing ends the
        access at once.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this access review.
        required: true
      tags:
      - access-reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessReviewDecideRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessReviewItem'
          description: ''
  /api/v1/access-reviews/{id}/export/:
    get:
      operationId: access_reviews_export_retrieve
      description: Download the review with every decision as CSV (evidence for auditors).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this access review.
        required: true
      tags:
      - access-reviews
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: CSV file
  /api/v1/access-reviews/{id}/items/:
    get:
      operationId: access_reviews_items_list
      description: Everyone's access in this review (all rows; filter with decision
        / search).
      parameters:
      - in: query
        name: decision
        schema:
          type: string
        description: pending, keep, remove or ended
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this access review.
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Name, email, role or place
      tags:
      - access-reviews
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessReviewItem'
          description: ''
  /api/v1/access-reviews/schedule/:
    get:
      operationId: access_reviews_schedule_retrieve
      description: When the next review is due, and whether the one in progress is
        overdue.
      tags:
      - access-reviews
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReviewSchedule'
          description: ''
  /api/v1/accounts/:
    get:
      operationId: accounts_list
      description: |-
        Everyone who can (or could) sign in. Staff accounts follow the person's employment
        status; accounts of people who are not staff are switched off and on here.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
        description: staff or not_staff
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Part of a name or email
      - in: query
        name: status
        schema:
          type: string
        description: active or inactive
      tags:
      - accounts
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
    post:
      operationId: accounts_create
      description: |-
        Everyone who can (or could) sign in. Staff accounts follow the person's employment
        status; accounts of people who are not staff are switched off and on here.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/accounts/{id}/:
    get:
      operationId: accounts_retrieve
      description: |-
        Everyone who can (or could) sign in. Staff accounts follow the person's employment
        status; accounts of people who are not staff are switched off and on here.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - accounts
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/accounts/{id}/deactivate/:
    post:
      operationId: accounts_deactivate_create
      description: Switch off an account of someone who is not staff (signs them out
        everywhere).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/accounts/{id}/invitation/:
    post:
      operationId: accounts_invitation_create
      description: (Re)send the activation email to an account that has not chosen
        a password yet.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - accounts
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/accounts/{id}/reactivate/:
    post:
      operationId: accounts_reactivate_create
      description: |-
        Everyone who can (or could) sign in. Staff accounts follow the person's employment
        status; accounts of people who are not staff are switched off and on here.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/accounts/{id}/reset-two-factor/:
    post:
      operationId: accounts_reset_two_factor_create
      description: 'Lost phone: remove two-factor; the person sets it up again at
        the next sign-in.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - accounts
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/accounts/{id}/sign-out-everywhere/:
    post:
      operationId: accounts_sign_out_everywhere_create
      description: |-
        Everyone who can (or could) sign in. Staff accounts follow the person's employment
        status; accounts of people who are not staff are switched off and on here.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - accounts
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/api-endpoints/:
    get:
      operationId: api_endpoints_retrieve
      description: Every API endpoint with its access rule, scope and audit events,
        read from the code.
      tags:
      - api-endpoints
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEndpointList'
          description: ''
  /api/v1/audit-events/:
    get:
      operationId: audit_events_list
      description: Audit search for auditors. Searching and exporting the audit log
        are themselves audited.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor_id
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
        description: First part of the action, e.g. auth, access, staff, admin.
      - in: query
        name: date_from
        schema:
          type: string
        description: From this day (inclusive).
      - in: query
        name: date_to
        schema:
          type: string
        description: Up to this day (inclusive).
      - in: query
        name: facility_id
        schema:
          type: string
      - in: query
        name: occurred_after
        schema:
          type: string
      - in: query
        name: occurred_before
        schema:
          type: string
      - in: query
        name: outcome
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: person
        schema:
          type: string
        description: Part of a person's name or email.
      - in: query
        name: request_id
        schema:
          type: string
        description: Reference number shown on an error screen.
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      tags:
      - audit-events
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/audit-events/actions/:
    get:
      operationId: audit_events_actions_list
      description: Every known event type with a plain-language name, for the filter
        list.
      tags:
      - audit-events
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditAction'
          description: ''
  /api/v1/audit-events/export/:
    get:
      operationId: audit_events_export_retrieve
      description: Download matching events as CSV (newest first, at most 5,000 rows).
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor_id
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
        description: First part of the action, e.g. auth, access, staff, admin.
      - in: query
        name: date_from
        schema:
          type: string
        description: From this day (inclusive).
      - in: query
        name: date_to
        schema:
          type: string
        description: Up to this day (inclusive).
      - in: query
        name: facility_id
        schema:
          type: string
      - in: query
        name: occurred_after
        schema:
          type: string
      - in: query
        name: occurred_before
        schema:
          type: string
      - in: query
        name: outcome
        schema:
          type: string
      - in: query
        name: person
        schema:
          type: string
        description: Part of a person's name or email.
      - in: query
        name: request_id
        schema:
          type: string
        description: Reference number shown on an error screen.
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      tags:
      - audit-events
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: CSV file
  /api/v1/audit-integrity-checks/:
    get:
      operationId: audit_integrity_checks_list
      description: Results of the tamper-evidence check, newest first, and "Check
        now".
      tags:
      - audit-integrity-checks
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditIntegrityCheck'
          description: ''
    post:
      operationId: audit_integrity_checks_create
      description: Seal new events and check the whole chain now. Takes a few seconds.
      tags:
      - audit-integrity-checks
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditIntegrityCheckDetail'
          description: ''
  /api/v1/audit-integrity-checks/{id}/:
    get:
      operationId: audit_integrity_checks_retrieve
      description: Results of the tamper-evidence check, newest first, and "Check
        now".
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audit integrity check.
        required: true
      tags:
      - audit-integrity-checks
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditIntegrityCheckDetail'
          description: ''
  /api/v1/audit-integrity-checks/status/:
    get:
      operationId: audit_integrity_checks_status_retrieve
      description: Where the chain stands now, and the latest check.
      tags:
      - audit-integrity-checks
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditIntegrityStatus'
          description: ''
  /api/v1/auth/confirm-identity/:
    get:
      operationId: auth_confirm_identity_retrieve
      description: '"Confirm it''s you" before a sensitive action (HIMS-IAM-007).
        Only tries are rate limited.'
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIdentityStatus'
          description: ''
    post:
      operationId: auth_confirm_identity_create
      description: '"Confirm it''s you" before a sensitive action (HIMS-IAM-007).
        Only tries are rate limited.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmIdentityRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIdentityStatus'
          description: ''
  /api/v1/auth/confirm-identity/end/:
    post:
      operationId: auth_confirm_identity_end_create
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIdentityStatus'
          description: ''
  /api/v1/auth/confirm-identity/passkey-options/:
    post:
      operationId: auth_confirm_identity_passkey_options_create
      description: The challenge for answering "confirm it's you" with a passkey (HIMS-IAM-014).
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie the SPA must echo in X-CSRFToken on unsafe
        requests.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/invitations/accept/:
    post:
      operationId: auth_invitations_accept_create
      description: |-
        Invitation endpoints are used before the person has a password, so they are public,
        CSRF-protected and rate limited. The token comes in the body, never in the URL.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/invitations/inspect/:
    post:
      operationId: auth_invitations_inspect_create
      description: |-
        Invitation endpoints are used before the person has a password, so they are public,
        CSRF-protected and rate limited. The token comes in the body, never in the URL.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationDetails'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 200 = signed in. 202 = password accepted; send the authenticator
        code to /auth/login/verify/ to finish signing in.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        '202':
          content:
